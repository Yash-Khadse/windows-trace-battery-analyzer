name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo guard and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard (privacy and safety rules)
        run: bash scripts/ci/guard.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  collector:
    name: Collector (.NET 8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Build (warnings are errors)
        run: dotnet build collector/Wtba.sln -c Release -warnaserror
      - name: Test (fakes only, no ETW session is created)
        run: dotnet test collector/Wtba.sln -c Release --no-build
      - name: Vulnerable packages
        shell: bash
        run: |
          out=$(dotnet list collector/Wtba.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then exit 1; fi

  python:
    name: Pipeline and API (Python 3.11 + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wtba_ci
          POSTGRES_PASSWORD: wtba_ci_password
          POSTGRES_DB: wtba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wtba_ci -d wtba_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      WTBA_TEST_DATABASE_URL: postgresql+psycopg://wtba_ci:wtba_ci_password@127.0.0.1:5432/wtba_test
      WTBA_HASH_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Pipeline - lint, types, tests
        working-directory: pipeline
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy src
          uv run pytest -q
      - name: API - lint, types, tests
        working-directory: api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run mypy src
          uv run pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          for d in pipeline api; do
            (cd "$d" && uv export --frozen --no-hashes --no-emit-project --no-emit-local > "${RUNNER_TEMP}/req-$d.txt")
            uvx pip-audit==2.10.1 -r "${RUNNER_TEMP}/req-$d.txt" --no-deps --disable-pip
          done

  web:
    name: Dashboard (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production bundle must not contain mock data
        run: npm run check:bundle
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
